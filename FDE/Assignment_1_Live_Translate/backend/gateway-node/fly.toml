app = "fde-live-translate-gateway-oktavianusludiro"
primary_region = "sjc"

[build]
  dockerfile = "../../Dockerfile.gateway"

[env]
  PORT = "8787"
  AI_SERVICE_URL = "http://fde-live-translate-ai-oktavianusludiro.internal:8000"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    soft_limit = 50
    hard_limit = 100

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
